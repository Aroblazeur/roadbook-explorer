<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Mardi Multi</title>
<style>
:root{color-scheme:dark;--bg:#0f1318;--panel:#171d24;--panel2:#202833;--line:#303945;--txt:#f5f7fa;--muted:#a5b0bd;--accent:#5865f2;--good:#2ecc71;--bad:#ff6b6b}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--txt);font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,sans-serif}.wrap{max-width:980px;margin:auto;padding:16px}.top{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap;margin-bottom:14px}.title{display:flex;gap:10px;align-items:center}.title h1{font-size:26px;margin:0}.pill{background:#232b35;border:1px solid var(--line);padding:7px 10px;border-radius:999px;font-size:13px;color:var(--muted)}.panel{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px;margin:10px 0}.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}input,select,button{font:inherit;color:var(--txt);background:var(--panel2);border:1px solid #3a4654;border-radius:10px;padding:11px 12px}input{min-width:170px;flex:1}button{cursor:pointer}.primary{background:var(--accent);border-color:var(--accent)}.game{display:grid;grid-template-columns:84px 1fr auto;gap:14px;align-items:start}.thumb{width:84px;height:84px;border-radius:10px;object-fit:cover;background:#11161d}.name{font-weight:750;font-size:20px;color:white;text-decoration:none}.name:hover{text-decoration:underline}.meta,.small{color:var(--muted);font-size:13px}.desc{margin-top:6px;color:#d7dde5;font-size:14px}.note{margin-top:9px;padding:9px 10px;border-left:3px solid var(--accent);background:#121820;border-radius:6px;font-size:14px}.votes{display:flex;gap:7px;flex-wrap:wrap;justify-content:flex-end}.vote.on.want{outline:2px solid var(--good)}.vote.on.exclude{outline:2px solid var(--bad)}.who{margin-top:6px;font-size:12px;color:var(--muted);text-align:right;max-width:240px}.searchResults{margin-top:8px;display:grid;gap:6px}.result{display:flex;align-items:center;gap:9px;padding:9px;border:1px solid var(--line);border-radius:10px;background:#151b22;cursor:pointer}.result img{width:64px;height:30px;object-fit:cover;border-radius:5px}.status{font-size:13px;color:var(--muted)}.empty{padding:28px;text-align:center;color:var(--muted)}
@media(max-width:700px){.wrap{padding:12px}.game{grid-template-columns:64px 1fr}.thumb{width:64px;height:64px}.votes{grid-column:1/-1;justify-content:flex-start}.who{text-align:left;max-width:none}.name{font-size:18px}.title h1{font-size:22px}}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <div class="title"><div style="font-size:30px">🎮</div><div><h1>Mardi Multi</h1><div class="small">Votez pour les jeux à essayer ensemble</div></div></div>
    <div class="pill" id="count">Chargement…</div>
  </div>

  <div class="panel">
    <div class="row">
      <input id="pseudo" placeholder="Ton pseudo">
      <button class="primary" id="savePseudo">Enregistrer</button>
      <span class="status" id="pseudoStatus"></span>
    </div>
  </div>

  <div class="panel">
    <div class="row">
      <input id="searchInput" placeholder="Ajouter un jeu (recherche Steam)…">
      <button id="manualAdd">Ajouter manuellement</button>
      <select id="sort">
        <option value="votes">Plus demandés</option>
        <option value="name">A → Z</option>
        <option value="recent">Ajouts récents</option>
      </select>
    </div>
    <div class="searchResults" id="searchResults"></div>
  </div>

  <div id="games"></div>
</div>
<script>
const API='https://wuberwxheznzntdyqwyj.supabase.co/functions/v1/mardi-multi';
const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
let voterKey=localStorage.getItem('mm_voter_key');if(!voterKey){voterKey=crypto.randomUUID();localStorage.setItem('mm_voter_key',voterKey)}
let pseudo=localStorage.getItem('mm_pseudo')||'';let games=[];
const pseudoEl=document.getElementById('pseudo');pseudoEl.value=pseudo;
document.getElementById('savePseudo').onclick=()=>{pseudo=pseudoEl.value.trim();if(!pseudo)return alert('Entre un pseudo.');localStorage.setItem('mm_pseudo',pseudo);document.getElementById('pseudoStatus').textContent='Pseudo enregistré';setTimeout(()=>document.getElementById('pseudoStatus').textContent='',1500)};

async function api(path,opts){const r=await fetch(API+path,opts);let j={};try{j=await r.json()}catch{}if(!r.ok)throw new Error(j.error||'Erreur réseau');return j}
async function load(){try{games=await api('/api/games?voter_key='+encodeURIComponent(voterKey));render()}catch(e){document.getElementById('games').innerHTML='<div class="panel empty">Erreur de chargement : '+esc(e.message)+'</div>'}}
function render(){let a=[...games];const mode=document.getElementById('sort').value;if(mode==='votes')a.sort((x,y)=>(y.want_count-y.exclude_count)-(x.want_count-x.exclude_count)||x.name.localeCompare(y.name));if(mode==='name')a.sort((x,y)=>x.name.localeCompare(y.name));if(mode==='recent')a.sort((x,y)=>new Date(y.created_at)-new Date(x.created_at));document.getElementById('count').textContent=a.length+' jeux';
  document.getElementById('games').innerHTML=a.map(g=>{
    const link=g.steam_url||g.external_url||'';const img=g.image_url||g.header_image_url||'';
    const whoWant=(g.want_voters||[]).join(', '),whoExclude=(g.exclude_voters||[]).join(', ');
    return `<div class="panel game">
      <div>${img?`<img class="thumb" src="${esc(img)}" alt="" onerror="this.style.visibility='hidden'">`:`<div class="thumb"></div>`}</div>
      <div>
        <div>${link?`<a class="name" href="${esc(link)}" target="_blank" rel="noopener">${esc(g.name)}</a>`:`<span class="name">${esc(g.name)}</span>`}</div>
        <div class="meta">${esc([g.genres,g.price_text].filter(Boolean).join(' • '))}</div>
        ${g.short_description?`<div class="desc">${esc(g.short_description)}</div>`:''}
        <div class="note">${g.note?esc(g.note):'<span class="meta">Aucune note du groupe</span>'}</div>
        <div style="margin-top:8px"><button data-note="${g.id}">✏️ Modifier la note</button></div>
      </div>
      <div>
        <div class="votes">
          <button class="vote want ${g.my_vote==='want'?'on':''}" data-vote="want" data-id="${g.id}">👍 ${g.want_count}</button>
          <button class="vote exclude ${g.my_vote==='exclude'?'on':''}" data-vote="exclude" data-id="${g.id}">🚫 ${g.exclude_count}</button>
        </div>
        <div class="who">${whoWant?`👍 ${esc(whoWant)}<br>`:''}${whoExclude?`🚫 ${esc(whoExclude)}`:''}</div>
      </div>
    </div>`
  }).join('');
  document.querySelectorAll('[data-vote]').forEach(b=>b.onclick=()=>vote(+b.dataset.id,b.dataset.vote,b.classList.contains('on')));
  document.querySelectorAll('[data-note]').forEach(b=>b.onclick=()=>editNote(+b.dataset.note));
}
async function vote(id,v,isOn){pseudo=(localStorage.getItem('mm_pseudo')||pseudoEl.value.trim());if(!pseudo)return alert('Entre d’abord ton pseudo en haut.');try{await api('/api/vote',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({game_id:id,voter_key:voterKey,voter_name:pseudo,vote:isOn?null:v})});await load()}catch(e){alert(e.message)}}
async function editNote(id){const g=games.find(x=>x.id===id);const note=prompt('Petite description / note du groupe :',g?.note||'');if(note===null)return;try{await api('/api/note',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({game_id:id,note})});await load()}catch(e){alert(e.message)}}

document.getElementById('sort').onchange=render;
let timer;document.getElementById('searchInput').oninput=e=>{clearTimeout(timer);const q=e.target.value.trim();if(q.length<2){document.getElementById('searchResults').innerHTML='';return}timer=setTimeout(async()=>{try{const r=await api('/api/steam-search?q='+encodeURIComponent(q));document.getElementById('searchResults').innerHTML=r.map(x=>`<div class="result" data-appid="${x.appid}">${x.image?`<img src="${esc(x.image)}" alt="">`:''}<strong>${esc(x.name)}</strong></div>`).join('')||'<div class="status">Aucun résultat Steam — tu peux l’ajouter manuellement.</div>';document.querySelectorAll('[data-appid]').forEach(el=>el.onclick=()=>addSteam(+el.dataset.appid))}catch(e){document.getElementById('searchResults').innerHTML='<div class="status">Recherche Steam indisponible.</div>'}},300)};
async function addSteam(appid){try{await api('/api/add-steam',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({appid,added_by:localStorage.getItem('mm_pseudo')||''})});document.getElementById('searchInput').value='';document.getElementById('searchResults').innerHTML='';await load()}catch(e){alert(e.message)}}
document.getElementById('manualAdd').onclick=async()=>{const name=prompt('Nom du jeu :',document.getElementById('searchInput').value.trim());if(!name)return;const external_url=prompt('Lien externe (facultatif) :','')||'';try{await api('/api/add-manual',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({name,external_url,added_by:localStorage.getItem('mm_pseudo')||''})});document.getElementById('searchInput').value='';document.getElementById('searchResults').innerHTML='';await load()}catch(e){alert(e.message)}};
load();
</script>
</body>
</html>
